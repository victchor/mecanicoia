[project]
name = "mecanicoia"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "chromadb>=1.5.9",
    "fastapi[standard]>=0.159.1",
    "langchain-text-splitters>=1.1.3",
    "ollama>=0.6.0",
    "pymupdf>=2.0",
    "sentence-transformers>=6.2.0",
]

[project.scripts]
mecanicoia = "mecanicoia:main"

[build-system]
requires = ["uv_build>=0.12.24,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
